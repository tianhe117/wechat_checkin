{% from 'macros.html' import icon,csrf with context %}
<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 打卡助手</title><link rel="stylesheet" href="{{ url_for('static',filename='styles.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='fit.css') }}"></head><body class="page-login"><main class="login-page"><section class="card login-card"><div class="login-brand"><img src="{{ url_for('static',filename='icon.svg') }}" alt=""><h1>打卡助手</h1><p>管理你的每日计划</p></div>
{% if error %}<div class="notice amber" role="alert">{{ error }}</div>{% endif %}<form method="post">{{ csrf() }}<input type="hidden" name="next" value="{{ next }}"><div class="form-group"><label class="form-label" for="password">管理员密码</label><input class="field" id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入管理员密码" required></div><p class="login-session-note">登录后长期保持，此设备下次直接进入。</p><div class="spacer"></div><button class="btn primary full" type="submit">登录并进入工作台 {{ icon('play') }}</button></form></section></main></body></html>
