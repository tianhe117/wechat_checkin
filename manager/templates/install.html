{% extends 'base.html' %}{% block content %}<section class="card fit-form install-card"><div class="install-brand flex"><img src="{{ url_for('static',filename='icon.svg') }}" width="43" alt=""><div><h2>把打卡助手放到桌面</h2><p class="small muted">以后点击图标直接进入。</p></div></div><div class="radio-tabs"><input class="sr-only" name="platform" id="platform-ios" type="radio" checked><label for="platform-ios">iPhone / iPad</label><input class="sr-only" name="platform" id="platform-android" type="radio"><label for="platform-android">Android</label></div><div class="ios-guide"><ol class="instruction-list"><li>在 Safari 打开当前 HTTPS 地址。</li><li>点击分享，选择“添加到主屏幕”。</li><li>确认名称后添加。</li></ol></div><div class="android-guide"><ol class="instruction-list"><li>在支持安装的浏览器中打开当前 HTTPS 地址。</li><li>浏览器菜单选择“安装应用”或“添加到主屏幕”。</li><li>完成添加后，从桌面图标进入。</li></ol></div><div class="form-actions"><a class="btn primary" href="{{ url_for('overview') }}">返回首页</a></div></section>{% endblock %}
